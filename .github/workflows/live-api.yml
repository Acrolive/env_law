name: Live API verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-api:
    name: Trusted live API tests
    # Protect the "live-api" environment in repository settings before enabling this workflow.
    environment: live-api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20.9.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Run live API regression tests
        env:
          LAW_API_OC: ${{ secrets.LAW_API_OC }}
        run: |
          if [ -z "$LAW_API_OC" ]; then
            echo 'LAW_API_OC repository or environment secret is not configured.' >&2
            exit 1
          fi
          ./scripts/release_gate.sh --live-api-only --skip-gitleaks
